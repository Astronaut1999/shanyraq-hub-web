<!doctype html>
<html lang="kk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Шаңырақ — байланыс жоқ</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1a33;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
        text-align: center;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; color: #94a3b8; margin: 0 0 20px; }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Интернет байланысы жоқ</h1>
      <p>Байланыс қалпына келген соң бетті қайта жүктеңіз. Құрылғыда сақталған жобалар жоғалмайды.</p>
      <button onclick="location.reload()">Қайта жүктеу</button>
    </div>
  </body>
</html>
